server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Cada seção é uma pasta com index.html (/contas/, /criar/…).
  location / {
    try_files $uri $uri/ =404;
  }

  # HTML e config.js sempre frescos (troca de projeto/chave aparece na hora).
  location ~* (\.html|/assets/config\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # Estilos, scripts e marca podem ficar em cache por 1 hora.
  location ~* \.(css|js|svg|png|ico)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Página de demonstração e arquivos ocultos não vão para o ar.
  location ~ /(__|\.) {
    return 404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
